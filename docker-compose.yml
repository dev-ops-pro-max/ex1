services:
  bitcoind:
    image: bitcoin/bitcoin:latest
    container_name: lab-bitcoind
    ports:
      - "18443:18443"
    volumes:
      - lab-bitcoin-data:/home/bitcoin/.bitcoin
    command: >
      bitcoind -regtest
      -rpcuser=clnrpc -rpcpassword=clrpcpass
      -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0
      -wallet=lab -printtoconsole
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcuser=clnrpc", "-rpcpassword=clrpcpass", "-rpcport=18443", "-regtest", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cln-alice:
    image: elementsproject/lightningd:v24.05
    container_name: lab-cln-alice
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - LIGHTNINGD_NETWORK=regtest
    volumes:
      - lab-cln-alice-data:/root/.lightning
    ports:
      - "9735:9735"
    command: >
      --bitcoin-rpcuser=clnrpc
      --bitcoin-rpcpassword=clrpcpass
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcport=18443
      --lightning-dir=/root/.lightning
      --network=regtest
      --disable-plugin=offers

  cln-bob:
    image: elementsproject/lightningd:v24.05
    container_name: lab-cln-bob
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - LIGHTNINGD_NETWORK=regtest
    volumes:
      - lab-cln-bob-data:/root/.lightning
    ports:
      - "9736:9736"
    command: >
      --bitcoin-rpcuser=clnrpc
      --bitcoin-rpcpassword=clrpcpass
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcport=18443
      --lightning-dir=/root/.lightning
      --network=regtest
      --disable-plugin=offers

  cln-carol:
    image: elementsproject/lightningd:v24.05
    container_name: lab-cln-carol
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - LIGHTNINGD_NETWORK=regtest
    volumes:
      - lab-cln-carol-data:/root/.lightning
    ports:
      - "9737:9737"
    command: >
      --bitcoin-rpcuser=clnrpc
      --bitcoin-rpcpassword=clrpcpass
      --bitcoin-rpcconnect=bitcoind
      --bitcoin-rpcport=18443
      --lightning-dir=/root/.lightning
      --network=regtest
      --disable-plugin=offers

volumes:
  lab-bitcoin-data:
  lab-cln-alice-data:
  lab-cln-bob-data:
  lab-cln-carol-data:
